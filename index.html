<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NPO CM Paid Search — Performance Overview</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-is@18/umd/react-is.production.min.js" crossorigin></script>
<script src="https://unpkg.com/prop-types@15/prop-types.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>
<script src="https://unpkg.com/recharts@2.10.3/umd/Recharts.js" crossorigin></script>

<style>

    --watch-bg: #FBF3E3;
    --alert: #C1443D;
    --alert-bg: #FBEAE8;
    --accent: #3D5A80;

  }
  * { box-sizing: border-box; }
  body {

<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;
const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

// ---------- Constants ----------
const CM_CAMPAIGNS = {
  NON_BRAND: '[RL] Bonterra | NPO CM | Non-Brand | High Intent',
  BRAND: '[RL] Bonterra | Brand | NPO CM | High Intent',
  BRAND_TERMS: '[RL] Bonterra | Brand Terms | High Intent'
};

const PLATFORM_LABELS = {
  google: 'Google Ads',
  microsoft: 'Microsoft Ads',
  ngpvan: 'NGP VAN',
  demand: 'Demand Gen'
};

const PAUSED_STATUS_VALUES = ['paused', 'removed', 'ended'];

const STORAGE_KEY = 'npo_cm_dashboard_csv_urls_v1';

// ---------- Date helpers ----------
function parseDate(s) {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function fmtDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function fmtShort(s) {
  const d = parseDate(s);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
function addDays(d, n) {
  const copy = new Date(d);
  copy.setDate(copy.getDate() + n);
  return copy;
}
function daysBetween(a, b) {
  return Math.round((b - a) / 86400000);
}
function parseAnyDate(raw) {
  if (!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if (m) return `${m[3]}-${String(+m[1]).padStart(2,'0')}-${String(+m[2]).padStart(2,'0')}`;
  const d = new Date(s);
  if (!isNaN(d)) return fmtDate(d);
  return null;
}

// ---------- Number parsing/formatting ----------
function safeNum(v) {
  if (v === null || v === undefined || v === '' || v === '--') return null;
  let s = String(v).trim().replace(/\$/g, '').replace(/,/g, '');
  let isPct = false;
  if (s.endsWith('%')) { isPct = true; s = s.slice(0, -1); }
  const n = parseFloat(s);
  if (isNaN(n)) return null;
  return isPct ? n / 100 : n;
}
function fmtCurrency(n) {
  if (n === null || n === undefined) return '--';
  return '$' + n.toLocaleString('en-US', { maximumFractionDigits: 0 });
}
function fmtNum(n, decimals = 0) {
  if (n === null || n === undefined) return '--';
  return n.toLocaleString('en-US', { maximumFractionDigits: decimals });
}
function fmtPct(n, decimals = 1) {
  if (n === null || n === undefined) return '--';
  return (n * 100).toFixed(decimals) + '%';
}
function fmtDelta(pct) {
  if (pct === null || pct === undefined) return '--';
  const sign = pct > 0 ? '+' : '';
  return sign + (pct * 100).toFixed(0) + '%';
}
function shortCampaignName(full) {
  if (!full) return '';
  if (full.includes('Brand Terms')) return 'Brand Terms';
  if (full.includes('Non-Brand')) return 'Non-Brand';
  if (full.includes('| Brand |')) return 'Brand';
  if (full.includes('NGP_VAN_Brand')) return 'NGP VAN Brand';
  if (full.includes('NGP_VAN_Non-Brand_Political')) return 'NGP VAN Non-Brand (Political)';
  if (full.includes('NGP_VAN_Non-Brand_ESM')) return 'NGP VAN Non-Brand (ESM)';
  if (full.includes('NGP_VAN_Competitor')) return 'NGP VAN Competitor';
  if (full.includes('TOFU')) return 'Demand Gen TOFU';
  if (full.includes('BOFU')) return 'Demand Gen BOFU';
  return full;
}

// ---------- CSV parsing per platform ----------
function mapRow(platformKey, row) {
  const g = (...keys) => { for (const k of keys) { if (row[k] !== undefined) return row[k]; } return undefined; };
  const date = parseAnyDate(g('Date', 'Day'));
  const campaign = g('Campaign');
  if (!date || !campaign) return null;

  if (platformKey === 'google' || platformKey === 'demand') {
    return {
      date, campaign,
      status: g('Campaign status'),
      budget: safeNum(g('Budget')),
      cost: safeNum(g('Cost')),
      impr: safeNum(g('Impr.')),
      clicks: safeNum(g('Clicks')),
      avgCpc: safeNum(g('Avg. CPC')),
      demoRequest: safeNum(g('Demo Request')),
      meetingBooked: safeNum(g('Meeting Booked')),
      sqlOpen: safeNum(g('SQL Open')),
      mals: safeNum(g('MALs')),
      conversions: safeNum(g('Conversions'))
    };
  }
  if (platformKey === 'microsoft') {
    return {
      date, campaign,
      status: g('Status'),
      budget: safeNum(g('Budget')),
      cost: safeNum(g('Spend', 'Cost')),
      clicks: safeNum(g('Clicks')),
      impr: safeNum(g('Impr.')),
      ctr: safeNum(g('CTR')),
      conversions: safeNum(g('Conv.', 'Conversions')),
      convRate: safeNum(g('Conv. rate')),
      avgCpc: safeNum(g('Avg. CPC')),
      cpa: safeNum(g('CPA')),
      qualScore: safeNum(g('Qual. score'))
    };
  }
  if (platformKey === 'ngpvan') {
    return {
      date, campaign,
      budget: safeNum(g('Budget')),
      cost: safeNum(g('Cost')),
      impr: safeNum(g('Impr.')),
      clicks: safeNum(g('Clicks')),
      avgCpc: safeNum(g('Avg. CPC')),
      conversions: safeNum(g('Conversions'))
    };
  }
  return null;
}

function fetchAndParseCsv(url, platformKey) {
  return new Promise((resolve, reject) => {
    Papa.parse(url, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = results.data
          .map(r => mapRow(platformKey, r))
          .filter(r => r !== null);
        resolve(rows);
      },
      error: (err) => reject(err)
    });
  });
}

// ---------- Aggregation ----------
function inRange(dateStr, start, end) {
  const d = parseDate(dateStr);
  return d >= start && d <= end;
}
function sumField(rows, field) {
  let total = 0, hasAny = false;
  rows.forEach(r => { if (r[field] !== null && r[field] !== undefined) { total += r[field]; hasAny = true; } });
  return hasAny ? total : null;
}
function aggregateCampaign(rows, campaignName, start, end) {
  const filtered = rows.filter(r => r.campaign === campaignName && inRange(r.date, start, end));
  const cost = sumField(filtered, 'cost') || 0;
  const clicks = sumField(filtered, 'clicks') || 0;
  const impr = sumField(filtered, 'impr') || 0;
  const conversions = sumField(filtered, 'conversions') || 0;
  const demoRequest = filtered.some(r => r.demoRequest !== undefined) ? (sumField(filtered, 'demoRequest') || 0) : null;
  const meetingBooked = filtered.some(r => r.meetingBooked !== undefined) ? (sumField(filtered, 'meetingBooked') || 0) : null;
  const sqlOpen = filtered.some(r => r.sqlOpen !== undefined) ? (sumField(filtered, 'sqlOpen') || 0) : null;
  const mals = filtered.some(r => r.mals !== undefined) ? (sumField(filtered, 'mals') || 0) : null;
  return {
    campaign: campaignName, days: filtered.length, cost, clicks, impr, conversions,
    demoRequest, meetingBooked, sqlOpen, mals,
    ctr: impr > 0 ? clicks / impr : null,
    convRate: clicks > 0 ? conversions / clicks : null,
    demoRequestCvr: (demoRequest !== null && clicks > 0) ? demoRequest / clicks : null,
    costPerConv: conversions > 0 ? cost / conversions : null,
    costPerSql: (sqlOpen !== null && sqlOpen > 0) ? cost / sqlOpen : null,
    malToSqlRate: (sqlOpen !== null && mals !== null && mals > 0) ? sqlOpen / mals : null
  };
}
function pctChange(curr, prev) {
  if (curr === null || prev === null || prev === undefined || curr === undefined) return null;
  if (prev === 0) return curr === 0 ? 0 : null;
  return (curr - prev) / prev;
}
function getLatestStatus(rows, campaignName) {
  const campaignRows = rows.filter(r => r.campaign === campaignName && r.status).sort((a, b) => a.date.localeCompare(b.date));
  if (campaignRows.length === 0) return null;
  return campaignRows[campaignRows.length - 1].status;
}
function isCampaignPaused(rows, campaignName) {
  const status = getLatestStatus(rows, campaignName);
  if (!status) return false;
  return PAUSED_STATUS_VALUES.includes(String(status).toLowerCase().trim());
}
function detectAnomalies(platformKey, rows, currentStart, currentEnd, campaignList) {
  const alerts = [];
  const rangeLen = daysBetween(currentStart, currentEnd) + 1;
  const prevStart = addDays(currentStart, -rangeLen);
  const prevEnd = addDays(currentStart, -1);
  campaignList.forEach(campaignName => {
    if (isCampaignPaused(rows, campaignName)) return;
    const curr = aggregateCampaign(rows, campaignName, currentStart, currentEnd);
    const prev = aggregateCampaign(rows, campaignName, prevStart, prevEnd);
    if (curr.days === 0 || prev.days === 0) return;
    const checks = [];
    if (curr.demoRequest !== null) checks.push({ label: 'Demo Requests', curr: curr.demoRequest, prev: prev.demoRequest });
    else checks.push({ label: 'Conversions', curr: curr.conversions, prev: prev.conversions });
    checks.forEach(check => {
      const delta = pctChange(check.curr, check.prev);
      const meaningfulBase = check.prev >= 3;
      const isZeroDrop = check.curr === 0 && check.prev > 0;
      const isBigDrop = delta !== null && delta <= -0.4 && meaningfulBase;
      if (isZeroDrop || isBigDrop) {
        alerts.push({ platform: platformKey, campaign: campaignName, metric: check.label, curr: check.curr, prev: check.prev, delta, severity: (isZeroDrop || delta <= -0.6) ? 'alert' : 'watch' });
      }
    });
  });
  return alerts;
}
function getPresetRange(preset, latestDate, allData) {
  const end = latestDate;
  switch (preset) {
    case 'last7': return { start: addDays(end, -6), end };
    case 'last14': return { start: addDays(end, -13), end };
    case 'last30': return { start: addDays(end, -29), end };
    case 'thisWeek': { const dow = end.getDay(); const start = addDays(end, -dow); return { start, end: addDays(start, 6) > end ? end : addDays(start, 6) }; }
    case 'lastWeek': { const dow = end.getDay(); const thisWeekStart = addDays(end, -dow); const lastWeekStart = addDays(thisWeekStart, -7); return { start: lastWeekStart, end: addDays(lastWeekStart, 6) }; }
    case 'all': { let earliest = latestDate; Object.values(allData).forEach(rows => rows.forEach(r => { const d = parseDate(r.date); if (d < earliest) earliest = d; })); return { start: earliest, end }; }
    default: return { start: addDays(end, -6), end };
  }
}
function getLatestDataDate(allData) {
  let latest = null;
  Object.values(allData).forEach(rows => rows.forEach(r => { const d = parseDate(r.date); if (!latest || d > latest) latest = d; }));
  return latest;
}

// ---------- UI components ----------
function DeltaBadge({ pct, invert = false, prevLabel }) {
  if (pct === null || pct === undefined) return React.createElement('span', { style: { color: 'var(--ink-muted)', fontSize: 13, fontWeight: 500 } }, '—');
  const good = invert ? pct < 0 : pct > 0;
  const flat = Math.abs(pct) < 0.02;
  const color = flat ? 'var(--ink-muted)' : (good ? 'var(--good)' : 'var(--alert)');
  const arrow = flat ? '→' : (pct > 0 ? '↑' : '↓');
  return React.createElement('span', { style: { display: 'inline-flex', alignItems: 'center', gap: 4, color, fontSize: 13, fontWeight: 600 } },
    arrow + ' ' + fmtDelta(pct),
    prevLabel !== undefined && React.createElement('span', { style: { color: 'var(--ink-muted)', fontWeight: 500 } }, ` (vs ${prevLabel})`)
  );
}

function KpiCard({ label, value, delta, invert, sub, prevLabel }) {
  return React.createElement('div', {
    style: { background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 10, padding: '16px 18px', flex: 1, minWidth: 140 }
  },
    React.createElement('div', { style: { fontSize: 12.5, color: 'var(--ink-muted)', fontWeight: 500, marginBottom: 6 } }, label),
    React.createElement('div', { style: { fontSize: 24, fontWeight: 650, color: 'var(--ink)', letterSpacing: '-0.01em', lineHeight: 1.1 } }, value),
    React.createElement('div', { style: { marginTop: 6, display: 'flex', alignItems: 'center', justifyContent: 'space-between' } },
      React.createElement(DeltaBadge, { pct: delta, invert, prevLabel }),
      sub && React.createElement('span', { style: { fontSize: 11.5, color: 'var(--ink-muted)' } }, sub)
    )
  );
}

function AlertRow({ alert }) {
  const isAlert = alert.severity === 'alert';
  return React.createElement('div', {
    style: { display: 'flex', alignItems: 'flex-start', gap: 10, padding: '12px 14px', background: isAlert ? 'var(--alert-bg)' : 'var(--watch-bg)', borderRadius: 8, border: `1px solid ${isAlert ? '#EBC9C6' : '#EEDCB8'}` }
  },
    React.createElement('span', { style: { color: isAlert ? 'var(--alert)' : 'var(--watch)', marginTop: 1, flexShrink: 0, fontSize: 15 } }, '⚠'),
    React.createElement('div', { style: { fontSize: 13.5, color: 'var(--ink)', lineHeight: 1.45 } },
      React.createElement('span', { style: { fontWeight: 650 } }, PLATFORM_LABELS[alert.platform]),
      ' — ',
      React.createElement('span', null, shortCampaignName(alert.campaign)),
      ': ',
      React.createElement('span', null, alert.curr === 0 ? `${alert.metric} dropped to zero` : `${alert.metric} fell ${fmtDelta(alert.delta)}`),
      React.createElement('span', { style: { color: 'var(--ink-muted)' } }, ` (${fmtNum(alert.prev, 1)} to ${fmtNum(alert.curr, 1)} vs. prior period)`)
    )
  );
}

function CampaignTrend({ rows, campaignName, start, end, metricKey, metricLabel }) {
  const chartData = useMemo(() => {
    return rows.filter(r => r.campaign === campaignName && inRange(r.date, start, end))
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(r => ({ date: fmtShort(r.date), value: computeMetricForRow(r, metricKey) }));
  }, [rows, campaignName, start, end, metricKey]);

  if (chartData.length === 0) return React.createElement('div', { style: { fontSize: 12.5, color: 'var(--ink-muted)', padding: '20px 0' } }, 'No data in this range.');

  const isPercentMetric = PERCENT_METRIC_KEYS.includes(metricKey);
  const isCurrencyMetric = CURRENCY_METRIC_KEYS.includes(metricKey);

  return React.createElement(ResponsiveContainer, { width: '100%', height: 140 },
    React.createElement(LineChart, { data: chartData, margin: { top: 6, right: 8, left: -20, bottom: 0 } },
      React.createElement(CartesianGrid, { strokeDasharray: '3 3', stroke: 'var(--border)', vertical: false }),
      React.createElement(XAxis, { dataKey: 'date', tick: { fontSize: 10.5, fill: 'var(--ink-muted)' }, axisLine: { stroke: 'var(--border)' }, tickLine: false, interval: 'preserveStartEnd' }),
      React.createElement(YAxis, { tick: { fontSize: 10.5, fill: 'var(--ink-muted)' }, axisLine: false, tickLine: false, width: 30 }),
      React.createElement(Tooltip, {
        contentStyle: { fontSize: 12.5, borderRadius: 8, border: '1px solid var(--border)' },
        formatter: (v) => [isPercentMetric ? fmtPct(v, 2) : isCurrencyMetric ? fmtCurrency(v) : fmtNum(v, 1), metricLabel]
      }),
      React.createElement(Line, { type: 'monotone', dataKey: 'value', stroke: 'var(--accent)', strokeWidth: 2, dot: false, activeDot: { r: 4 } })
    )
  );
}

// Metrics whose per-row "trend" value is a ratio computed from two raw fields
// on that same row, not a raw field itself. Each entry maps metricKey -> a
// function that computes that day's value from a single row.
const DERIVED_METRIC_KEYS = {
  ctr: (r) => (r.impr && r.impr > 0) ? (r.clicks || 0) / r.impr : null,
  convRate: (r) => (r.clicks && r.clicks > 0) ? (r.conversions || 0) / r.clicks : null,
  avgCpcDerived: (r) => (r.clicks && r.clicks > 0) ? (r.cost || 0) / r.clicks : null,
  demoRequestCvr: (r) => (r.clicks && r.clicks > 0 && r.demoRequest !== null && r.demoRequest !== undefined) ? r.demoRequest / r.clicks : null,
  malToSqlRate: (r) => (r.mals && r.mals > 0 && r.sqlOpen !== null && r.sqlOpen !== undefined) ? r.sqlOpen / r.mals : null,
  costPerSql: (r) => (r.sqlOpen && r.sqlOpen > 0) ? (r.cost || 0) / r.sqlOpen : null,
  costPerConv: (r) => (r.conversions && r.conversions > 0) ? (r.cost || 0) / r.conversions : null
};

const PERCENT_METRIC_KEYS = ['ctr', 'convRate', 'demoRequestCvr', 'malToSqlRate'];
const CURRENCY_METRIC_KEYS = ['avgCpcDerived', 'costPerSql', 'costPerConv', 'cost'];

function computeMetricForRow(row, metricKey) {
  if (DERIVED_METRIC_KEYS[metricKey]) {
    const v = DERIVED_METRIC_KEYS[metricKey](row);
    return v === null || v === undefined ? 0 : v;
  }
  const v = row[metricKey];
  return (v === null || v === undefined) ? 0 : v;
}

function MiniStat({ label, value, active, onClick }) {
  return React.createElement('button', {
    onClick,
    style: {
      textAlign: 'left', background: active ? 'var(--accent-bg)' : 'transparent',
      border: active ? '1px solid var(--accent)' : '1px solid transparent',
      borderRadius: 7, padding: '6px 8px', margin: '-6px -8px', cursor: 'pointer'
    }
  },
    React.createElement('div', { style: { fontSize: 11, color: active ? 'var(--accent)' : 'var(--ink-muted)', marginBottom: 2, fontWeight: active ? 650 : 400 } }, label),
    React.createElement('div', { style: { fontSize: 14, fontWeight: 600, color: 'var(--ink)' } }, value)
  );
}

function CampaignCard({ rows, campaignName, start, end, prevStart, prevEnd, hasKpiBreakdown, isBrandTerms }) {
  const [expanded, setExpanded] = useState(false);
  const curr = aggregateCampaign(rows, campaignName, start, end);
  const prev = aggregateCampaign(rows, campaignName, prevStart, prevEnd);
  const paused = isCampaignPaused(rows, campaignName);
  const primaryMetric = curr.demoRequest !== null
    ? { label: 'Demo Requests', curr: curr.demoRequest, prev: prev.demoRequest, key: 'demoRequest' }
    : { label: 'Conversions', curr: curr.conversions, prev: prev.conversions, key: 'conversions' };
  const delta = pctChange(primaryMetric.curr, primaryMetric.prev);
  const costDelta = pctChange(curr.cost, prev.cost);

  // Which metric's trend is currently shown in the chart. Defaults to the
  // card's primary metric; clicking any KPI below switches it.
  const [selectedMetric, setSelectedMetric] = useState({ key: primaryMetric.key, label: primaryMetric.label });

  const statDefs = [
    { key: 'clicks', label: 'Clicks', value: fmtNum(curr.clicks) },
    { key: 'impr', label: 'Impressions', value: fmtNum(curr.impr) },
    { key: 'ctr', label: 'CTR', value: fmtPct(curr.ctr, 2) },
    { key: 'avgCpcDerived', label: 'Avg CPC', value: curr.clicks > 0 ? fmtCurrency(curr.cost / curr.clicks) : '--' }
  ];
  if (hasKpiBreakdown && curr.demoRequest !== null) {
    statDefs.push(
      { key: 'demoRequestCvr', label: 'Demo Req. CVR', value: fmtPct(curr.demoRequestCvr, 2) },
      { key: 'meetingBooked', label: 'Meeting Booked', value: fmtNum(curr.meetingBooked, 1) },
      { key: 'sqlOpen', label: 'SQL Open', value: fmtNum(curr.sqlOpen, 1) },
      { key: 'mals', label: 'MALs', value: fmtNum(curr.mals, 1) },
      { key: 'malToSqlRate', label: 'MAL to SQL Rate', value: fmtPct(curr.malToSqlRate, 1) },
      { key: 'costPerSql', label: 'Cost / SQL', value: curr.costPerSql !== null ? fmtCurrency(curr.costPerSql) : '--' }
    );
  } else if (!hasKpiBreakdown) {
    statDefs.push(
      { key: 'convRate', label: 'Conv. Rate', value: fmtPct(curr.convRate, 2) },
      { key: 'costPerConv', label: 'Cost / Conv.', value: curr.costPerConv !== null ? fmtCurrency(curr.costPerConv) : '--' }
    );
  }

  return React.createElement('div', { style: { background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 10, overflow: 'hidden', opacity: paused ? 0.75 : 1 } },
    React.createElement('button', {
      onClick: () => setExpanded(!expanded),
      style: { width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '14px 18px', background: 'transparent', border: 'none', cursor: 'pointer', textAlign: 'left' }
    },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 10 } },
        React.createElement('span', { style: { fontSize: 14.5, fontWeight: 600, color: 'var(--ink)' } }, shortCampaignName(campaignName)),
        paused && React.createElement('span', { style: { fontSize: 10.5, fontWeight: 650, color: 'var(--watch)', background: 'var(--watch-bg)', borderRadius: 5, padding: '2px 6px' } }, 'Paused — excluded from alerts'),
        isBrandTerms && React.createElement('span', { style: { fontSize: 10.5, fontWeight: 650, color: 'var(--ink-muted)', border: '1px solid var(--border)', borderRadius: 5, padding: '2px 6px' } }, 'excluded from CM totals')
      ),
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 20 } },
        React.createElement('div', { style: { textAlign: 'right' } },
          React.createElement('div', { style: { fontSize: 11.5, color: 'var(--ink-muted)' } }, primaryMetric.label),

  const [error, setError] = useState(null);
  const [lastRefreshed, setLastRefreshed] = useState(null);

  const [preset, setPreset] = useState('last7');
  const [customStart, setCustomStart] = useState(null);
  const [customEnd, setCustomEnd] = useState(null);
  const [activePlatforms, setActivePlatforms] = useState(['google', 'microsoft', 'ngpvan', 'demand']);

  // Compare period — defaults to auto (equal-length period immediately before
  // the main range), but can be manually overridden with its own start/end,
  // same pattern as Google Ads' "Compare" date picker.
  const [compareMode, setCompareMode] = useState('auto'); // 'auto' | 'custom'
  const [compareStart, setCompareStart] = useState(null);
  const [compareEnd, setCompareEnd] = useState(null);

  useEffect(() => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      try { setUrls(JSON.parse(saved)); } catch (e) { /* ignore */ }
    }
    setLoadingUrls(false);
  }, []);

  const loadData = useCallback(async (urlSet) => {
    setLoading(true);
    setError(null);
    try {
      const [google, microsoft, ngpvan, demand] = await Promise.all([
        fetchAndParseCsv(urlSet.google, 'google'),
        fetchAndParseCsv(urlSet.microsoft, 'microsoft'),
        fetchAndParseCsv(urlSet.ngpvan, 'ngpvan'),
        fetchAndParseCsv(urlSet.demand, 'demand')
      ]);
      setAllData({ google, microsoft, ngpvan, demand });
      setLastRefreshed(new Date());
    } catch (e) {
      setError('Could not load one or more data sources. Check that the URLs are correct and still published. (' + e.message + ')');
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => {
    if (urls) loadData(urls);
  }, [urls, loadData]);

  const handleSaveUrls = (newUrls) => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(newUrls));
    setUrls(newUrls);
  };

  if (loadingUrls) return null;

  if (!urls) {
    return React.createElement(SetupScreen, { onSave: handleSaveUrls });
  }

  if (loading && !allData) {
    return React.createElement('div', { style: { padding: 60, textAlign: 'center', color: 'var(--ink-muted)', fontSize: 14 } }, 'Loading latest data…');
  }

  if (error && !allData) {
    return React.createElement('div', { style: { maxWidth: 500, margin: '60px auto', textAlign: 'center' } },
      React.createElement('p', { style: { color: 'var(--alert)', fontSize: 14, marginBottom: 16 } }, error),
      React.createElement('button', {
        onClick: () => setUrls(null),
        style: { padding: '8px 16px', fontSize: 13, borderRadius: 7, border: '1px solid var(--border)', background: 'var(--panel)', cursor: 'pointer' }
      }, 'Re-enter URLs')
    );
  }

  if (!allData) return null;

  const latestDate = getLatestDataDate(allData);
  const { start, end } = (() => {
    if (preset === 'custom' && customStart && customEnd) return { start: parseDate(customStart), end: parseDate(customEnd) };
    return getPresetRange(preset, latestDate, allData);
  })();
  const rangeLen = daysBetween(start, end) + 1;

  // Compare period: auto (equal-length window immediately before the main
  // range) unless the person has manually set their own compare dates.
  const autoPrevEnd = addDays(start, -1);
  const autoPrevStart = addDays(autoPrevEnd, -(rangeLen - 1));
  const prevStart = (compareMode === 'custom' && compareStart) ? parseDate(compareStart) : autoPrevStart;
  const prevEnd = (compareMode === 'custom' && compareEnd) ? parseDate(compareEnd) : autoPrevEnd;

  let allAlerts = [];
  Object.entries(allData).forEach(([platformKey, rows]) => {
    const campaigns = Array.from(new Set(rows.map(r => r.campaign)));
    allAlerts = allAlerts.concat(detectAnomalies(platformKey, rows, start, end, campaigns));
  });
  allAlerts.sort((a, b) => { if (a.severity !== b.severity) return a.severity === 'alert' ? -1 : 1; return (a.delta ?? -1) - (b.delta ?? -1); });

            React.createElement('input', { type: 'date', value: compareStart || fmtDate(prevStart), max: fmtDate(latestDate), onChange: (e) => setCompareStart(e.target.value), style: { fontSize: 12.5, padding: '5px 8px', borderRadius: 6, border: '1px solid var(--border)' } }),
            React.createElement('span', { style: { fontSize: 12.5, color: 'var(--ink-muted)' } }, 'to'),
            React.createElement('input', { type: 'date', value: compareEnd || fmtDate(prevEnd), max: fmtDate(latestDate), onChange: (e) => setCompareEnd(e.target.value), style: { fontSize: 12.5, padding: '5px 8px', borderRadius: 6, border: '1px solid var(--border)' } })
          ),
          React.createElement('span', { style: { fontSize: 11.5, color: 'var(--ink-muted)', marginLeft: 'auto' } },
            compareMode === 'auto'
              ? `Comparing to ${fmtShort(fmtDate(prevStart))}–${fmtShort(fmtDate(prevEnd))} (${rangeLen}-day prior period, auto)`
              : `Comparing to ${fmtShort(fmtDate(prevStart))}–${fmtShort(fmtDate(prevEnd))} (custom)`
          )
        )
      ),

      React.createElement('div', { style: { display: 'flex', gap: 8, marginBottom: 20, flexWrap: 'wrap' } },
        Object.keys(PLATFORM_LABELS).map(key => React.createElement('button', {
          key, onClick: () => togglePlatform(key),
          style: { fontSize: 12.5, fontWeight: 600, padding: '6px 14px', borderRadius: 20, border: `1px solid ${activePlatforms.includes(key) ? 'var(--ink)' : 'var(--border)'}`, background: activePlatforms.includes(key) ? 'var(--ink)' : 'transparent', color: activePlatforms.includes(key) ? '#fff' : 'var(--ink-muted)', cursor: 'pointer' }
        }, PLATFORM_LABELS[key]))
      ),

      React.createElement(OverviewStrip, { allData, start, end, prevStart, prevEnd }),

      allAlerts.length > 0
        ? React.createElement('div', { style: { marginBottom: 24 } },
            React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 } },
              React.createElement('span', { style: { color: 'var(--alert)', fontSize: 16 } }, '⚠'),
              React.createElement('h2', { style: { fontSize: 14.5, fontWeight: 650, margin: 0 } }, `${allAlerts.length} unusual shift${allAlerts.length !== 1 ? 's' : ''} flagged for this period`)
            ),
            React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: 6 } }, allAlerts.map((a, i) => React.createElement(AlertRow, { key: i, alert: a })))
          )
        : React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: 8, padding: '12px 14px', background: 'var(--good-bg)', borderRadius: 8, border: '1px solid #C9E4D4', marginBottom: 24, fontSize: 13 } },
            React.createElement('span', { style: { color: 'var(--good)', fontWeight: 650 } }, 'No unusual shifts'),
            React.createElement('span', { style: { color: 'var(--ink-muted)' } }, '— all campaigns are tracking within normal range vs. the prior period.')
          ),

      activePlatforms.includes('google') && React.createElement(PlatformSection, { platformKey: 'google', rows: allData.google, start, end, prevStart, prevEnd }),
      activePlatforms.includes('microsoft') && React.createElement(PlatformSection, { platformKey: 'microsoft', rows: allData.microsoft, start, end, prevStart, prevEnd }),
      activePlatforms.includes('ngpvan') && React.createElement(PlatformSection, { platformKey: 'ngpvan', rows: allData.ngpvan, start, end, prevStart, prevEnd }),
      activePlatforms.includes('demand') && React.createElement(PlatformSection, { platformKey: 'demand', rows: allData.demand, start, end, prevStart, prevEnd }),

      React.createElement('p', { style: { fontSize: 11, color: 'var(--ink-muted)', marginTop: 30, textAlign: 'center' } },
        'Alerts flag a drop of 40%+ (or a fall to zero) vs. the immediately preceding period of equal length, on a base of 3+ prior-period conversions/demo requests. Paused campaigns are excluded from alerts.'
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
